[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp-server"
version = "0.1.0"
description = "A local Telegram MCP server for deterministic research."
requires-python = ">=3.13,<3.14"
dependencies = [
    "Telethon>=1.42,<2",
    "fastmcp>=3,<4",
    "python-dotenv>=1,<2",
]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
